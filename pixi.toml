[workspace]
name = "painscreek-killings-head-tracking"
version = "0.0.0"
description = "Head tracking mod for The Painscreek Killings using CameraUnlock shared library"
channels = ["conda-forge"]
platforms = ["win-64"]

[tasks]
update-submodule = "git submodule update --remote cameraunlock-core && powershell -NoProfile -ExecutionPolicy Bypass -File cameraunlock-core/scripts/update-submodule.ps1"
sync = "git submodule update --remote cameraunlock-core"
# Unity reference stubs, compiled from the shared sources in the core submodule.
# net35 means pre-2017.3 Unity, so no UnityEngine.InputLegacyModule is produced -
# Input lives in UnityEngine.dll on that engine version, which is exactly what this
# game's Managed folder holds. No UnityEngine.UI.dll: the mod reaches the game's
# cursor Text through reflection and references no uGUI type at compile time.
setup = 'powershell -ExecutionPolicy Bypass -Command "& cameraunlock-core/csharp/stubs/build-unity-stubs.ps1 -OutputPath src/PainscreekHeadTracking/libs -TargetFramework net35 -SkipUI"'
restore = { cmd = "dotnet restore src/PainscreekHeadTracking/PainscreekHeadTracking.csproj", depends-on = ["setup"] }
build = { cmd = "dotnet build src/PainscreekHeadTracking/PainscreekHeadTracking.csproj -c Release", depends-on = ["restore"] }
# Checks that every member reference the build emits resolves against the
# assemblies it binds to at runtime. Stub/engine shape drift (a property
# declared as a field, or the reverse) compiles cleanly and only fails in
# game. Needs the game installed; skips and succeeds without it.
verify-refs = { cmd = "powershell -ExecutionPolicy Bypass -File cameraunlock-core/scripts/verify-assembly-refs.ps1 -GameId painscreek-killings -BuildDir src/PainscreekHeadTracking/bin/Release", depends-on = ["build"] }
# Bump vendored mod-loader copies to latest upstream within pinned range.
# Manual; commit the result. CI does not run this.
update-deps = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/update-deps.ps1"
install = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/deploy.ps1 Release", depends-on = ["build"] }
# The config tests, among them the differential test in tests/config_differential, which holds
# the frozen legacy import to the dev pre-release's reader on the README's example files and on
# core's mutation corpus.
test = { cmd = "dotnet test tests/PainscreekHeadTracking.Tests/PainscreekHeadTracking.Tests.csproj -c Release", depends-on = ["build"] }
package = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/package-release.ps1", depends-on = ["test"] }
uninstall = "scripts\\uninstall.cmd"
vanilla = "powershell -ExecutionPolicy Bypass -File scripts/vanilla.ps1"
clean = "dotnet clean src/PainscreekHeadTracking/PainscreekHeadTracking.csproj"

# Validate release readiness
validate-release = "powershell -ExecutionPolicy Bypass -File scripts/validate-release.ps1"

# Full release workflow - creates tag and pushes to trigger CI release
# Usage: pixi run release <major|minor|patch|X.Y.Z>
# Example: pixi run release patch
release = "powershell -ExecutionPolicy Bypass -File scripts/release.ps1"

# Dev-only: patch the installed game's Assembly-CSharp.dll to skip menu fades,
# disclaimer, and prologue narration on startup. For iteration speed only;
# not shipped. Use dev-fastboot-restore to revert.
dev-fastboot = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/dev-fastboot.ps1"
dev-fastboot-restore = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/dev-fastboot-restore.ps1"
