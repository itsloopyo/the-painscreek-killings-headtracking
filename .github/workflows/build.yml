name: Build

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  build:
    name: Build and Validate
    runs-on: windows-latest
    if: ${{ !startsWith(github.event.head_commit.message, 'Release v') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '8.0.x'

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          # No conda dependencies: this build runs on the .NET SDK + PowerShell,
          # so the pixi environment is empty. setup-pixi's post-install
          # `pixi list` errors on an empty env; skip its install/list chain and
          # let `pixi run package` provision the env on demand.
          run-install: false

      # Build + package through the SAME command a developer runs locally. Every
      # build dependency (Unity stubs) is produced by
      # cameraunlock-core/csharp/stubs/build-unity-stubs.ps1 inside the pixi task
      # chain - no build logic lives in this workflow, so local and CI can't drift.
      - name: Build and package
        shell: pwsh
        run: pixi run package

      - name: Verify installer was produced
        shell: pwsh
        run: |
          $zip = Get-ChildItem release/*-installer.zip -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $zip) {
            Write-Host "::error::No installer ZIP was produced by 'pixi run package'"
            exit 1
          }
